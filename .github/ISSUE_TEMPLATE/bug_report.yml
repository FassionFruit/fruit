name: Bug report
description: Report a reproducible bug in FassionFruit.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check whether the issue has already been reported.
        Include a minimal reproduction whenever possible.
        Do not include secrets or proprietary native binaries.

  - type: input
    id: version
    attributes:
      label: FassionFruit version
      description: The released version or commit hash.
      placeholder: "0.2.2"
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Java runtime
      description: Include vendor and full version.
      placeholder: "OpenJDK 25.0.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: "x86_64, aarch64"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest complete example.
      placeholder: |
        1. Define a @NativeLibrary interface...
        2. Load it with FFM.load(...)
        3. Invoke the method...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages and logs
      description: Include relevant stack traces. Redact sensitive information.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that this issue has not already been reported.
          required: true
        - label: I can reproduce this issue with the information provided.
          required: true
